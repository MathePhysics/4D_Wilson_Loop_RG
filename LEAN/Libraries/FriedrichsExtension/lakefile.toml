name = "FriedrichsExtension"
version = "0.17.0"
defaultTargets = ["FriedrichsExtension"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "8d52ea9a145a9255c4d301c0d1a1b8bf6e59305a"

# Reusable totalisation-safety library.  In the user's standard layout,
# `FriedrichsExtension` and `TotalisationSafety` are sibling directories under
# `.../Lean/Libraries/`.
[[require]]
name = "TotalisationSafety"
path = "../TotalisationSafety"

[[lean_lib]]
name = "FriedrichsExtension"
